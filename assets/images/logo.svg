<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <linearGradient id="greenGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccc65" />
      <stop offset="100%" stop-color="#7cb342" />
    </linearGradient>
  </defs>

  <!-- Emblem on the left -->
  <g transform="translate(15, 10) scale(0.7)">
    <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#greenGradL)" stroke-width="8" />
    <circle cx="100" cy="100" r="80" fill="#ffffff" stroke="url(#pinkGradL)" stroke-width="7" />
    <text x="60" y="125" font-family="'Cairo', 'Outfit', sans-serif" font-size="82" font-weight="900" fill="url(#pinkGradL)" text-anchor="middle">L</text>
    <text x="135" y="125" font-family="'Cairo', 'Outfit', sans-serif" font-size="82" font-weight="900" fill="url(#greenGradL)" text-anchor="middle">R</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(170, 75)">
    <!-- Love Recipes Main Name -->
    <text x="0" y="5" font-family="'Outfit', 'Cairo', cursive, sans-serif" font-size="52" font-weight="800" fill="url(#pinkGradL)">Love Recipes</text>
    <!-- Tagline -->
    <text x="5" y="38" font-family="'Cairo', 'Outfit', sans-serif" font-size="20" font-weight="700" fill="url(#greenGradL)" letter-spacing="1.5">TROPICAL HOLIDAY &bull; DESSERT &amp; CAFE</text>
  </g>
</svg>
