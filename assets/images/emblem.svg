<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ccc65" />
      <stop offset="100%" stop-color="#7cb342" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#greenGrad)" stroke-width="6" />
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" stroke="url(#pinkGrad)" stroke-width="6" />

  <!-- Monogram LR -->
  <g filter="url(#shadow)">
    <!-- Letter L in Pink -->
    <text x="60" y="125" font-family="'Cairo', 'Outfit', 'Montserrat', sans-serif" font-size="82" font-weight="900" fill="url(#pinkGrad)" text-anchor="middle">L</text>
    
    <!-- Letter R in Fresh Lime Green -->
    <text x="135" y="125" font-family="'Cairo', 'Outfit', 'Montserrat', sans-serif" font-size="82" font-weight="900" fill="url(#greenGrad)" text-anchor="middle">R</text>
  </g>

  <!-- Sweet Little Sparkle Heart -->
  <path d="M100 68 C 100 62, 92 57, 85 64 C 76 73, 100 87, 100 87 C 100 87, 124 73, 115 64 C 108 57, 100 62, 100 68 Z" fill="#ff4081" opacity="0.9" />
</svg>
